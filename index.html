<style>
/* Layout: app de uma tela — trilho lateral no computador, barra de abas embaixo no celular; coluna de conteúdo de até 760px (agenda usa até 1100px). */
:root{
  --bg:#F6F2F4; --surface:#FFFFFF; --sunk:#EFE8EC; --ink:#26141F; --muted:#7B6672; --line:#E6DAE1;
  --accent:#C93A5A; --accent-ink:#FFFFFF; --accent-soft:#FBE1E7;
  --good:#2C7A57; --good-soft:#DDF1E6; --warn:#B4740F; --warn-soft:#FBEBCF; --bad:#BD3434; --bad-soft:#F8DEDE;
  --hab:#2E8B5E; --hab-soft:#DFF3E7; --tar:#2F72B8; --tar-soft:#E0ECF8; --com:#7D4FB8; --com-soft:#ECE2F8;
  --c0:#C93A5A; --c1:#3E7CB1; --c2:#2C9C78; --c3:#D08A1E; --c4:#8B5CC2; --c5:#D4612E; --c6:#4F9AA6; --c7:#B5527F; --c8:#6E8B3D; --c9:#8A7A70; --c10:#5566C9; --c11:#A0663A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(38,20,31,.06),0 8px 24px -12px rgba(38,20,31,.18);
  --hero-a:#F7D6DF; --hero-b:#EBD9F2;
  --night:#4B4FB0; --night-soft:#E6E6F7; --sun:#E09A1E; --sun-soft:#FBEBCF;
  --nav-bg:#2A1820; --nav-line:#2A1820; --nav-fg:rgba(255,255,255,.80); --nav-on:#FF6B95; --nav-on-bg:rgba(255,255,255,.09);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150D12; --surface:#21161C; --sunk:#1B1217; --ink:#F6ECF1; --muted:#B39BA8; --line:#37272F;
  --accent:#F0718B; --accent-ink:#2A0E17; --accent-soft:#3D1D27;
  --good:#5FC294; --good-soft:#173528; --warn:#E6AC4E; --warn-soft:#3A2B12; --bad:#F07474; --bad-soft:#3E1C1C;
  --hab:#6CCB98; --hab-soft:#16301F; --tar:#7BB0EA; --tar-soft:#15253A; --com:#B996EC; --com-soft:#291C3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); --hero-a:#3A1A26; --hero-b:#2B1C38; --nav-bg:#2C1F26; --nav-line:#43323B; --night:#8F93F2; --night-soft:#24234A; --sun-soft:#3A2B12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#150D12; --surface:#21161C; --sunk:#1B1217; --ink:#F6ECF1; --muted:#B39BA8; --line:#37272F;
  --accent:#F0718B; --accent-ink:#2A0E17; --accent-soft:#3D1D27;
  --good:#5FC294; --good-soft:#173528; --warn:#E6AC4E; --warn-soft:#3A2B12; --bad:#F07474; --bad-soft:#3E1C1C;
  --hab:#6CCB98; --hab-soft:#16301F; --tar:#7BB0EA; --tar-soft:#15253A; --com:#B996EC; --com-soft:#291C3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); --hero-a:#3A1A26; --hero-b:#2B1C38; --nav-bg:#2C1F26; --nav-line:#43323B; --night:#8F93F2; --night-soft:#24234A; --sun-soft:#3A2B12; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,34px);font-weight:800;line-height:1.05}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{display:flex;min-height:100%}
#side{display:none}
#main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(120px + env(safe-area-inset-bottom,0px))}
#view{max-width:760px;margin:0 auto;padding-bottom:20px;display:flex;flex-direction:column;gap:18px}
#view.wide{max-width:1100px}

#tabs{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--nav-bg);border:1px solid var(--nav-line);border-radius:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px;box-shadow:0 12px 30px -10px rgba(20,8,14,.45),0 2px 6px rgba(20,8,14,.18)}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px;color:var(--nav-fg);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:22px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
#tabs button.on{color:var(--nav-on);background:var(--nav-on-bg)}
#tabs .ic svg{width:24px;height:24px;stroke-width:1.7}
@media (max-width:360px){#tabs button{font-size:10px}}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

@media (min-width:900px){
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:3px;width:232px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:28px 14px 20px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--sunk)}
  #side .brand{font-family:var(--display);font-weight:800;font-size:26px;padding:0 10px 18px;letter-spacing:-.02em}
  #side .brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
  #side button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500;text-align:left}
  #side button:hover{background:var(--surface)}
  #side button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
  #main{padding-block:32px 60px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.lrow:first-child{border-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .ic svg{width:16px;height:16px}
.iconbtn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mut{background:var(--sunk);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.segtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.segtabs button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.segtabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:1.25;text-align:left;color:var(--ink)}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.25em}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:.5}

.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit;font:inherit}

.cattiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.g1{background:linear-gradient(140deg,#B4475F,#6E3A7A)} .g2{background:linear-gradient(140deg,#2F72B8,#3E4C8E)} .g3{background:linear-gradient(140deg,#2C7A57,#2C5A6E)} .g4{background:linear-gradient(140deg,#C4752A,#9C3F45)} .g5{background:linear-gradient(140deg,#7D4FB8,#3C3A8E)} .g6{background:linear-gradient(140deg,#5D6B78,#2E3640)}

.dsubs{display:flex;flex-direction:column;gap:8px}

.tile .ic{color:var(--accent)}
.tile b{font-family:var(--display);font-size:17px}

#drawer{position:fixed;inset:0;z-index:45}

 l:'<path d="M15 5l-7 7 7 7"/>', r:'<path d="M9 5l7 7-7 7"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',

 'Transporte':['uber','99app','99 pop','99pop','posto','combustivel','gasolina','shell','ipiranga','petrobras','metro ','metrorio','riocard','onibus','estacionamento','sem parar','supervia'],

};
const KWLIST=Object.entries(KW).flatMap(([c,ks])=>ks.map(k=>[k,c])).sort((a,b)=>b[0].length-a[0].length);
const DEF={
 perfil:{nome:'Thais',onboard:false,tema:'auto',menu:['hoje','agenda','dinheiro','saude'],notif:{on:false,antes:10,resumo:'08:00',inj:true,contas:true}},
 tarefas:{items:[],mente:[]},

 fin:{config:{renda:0,guardar:0,limite:90,cats:CATS0,regras:{},ignorarRep:[],extraDivida:0,metodo:'avalanche',ack:{}},recorrentes:[],compras:[],metas:[],reserva:{meses:6,guardado:0,foto:''},dividas:[],decisoes:{puladas:{},feitas:{}}},
 saude:{ciclo:{registros:[]},injecao:{intervalo:30,ultima:'',historico:[],nome:''},sono:[]},

};
const KEYS=Object.keys(DEF);
let S=clone(DEF);
let M={};

const LS='rumo-cache-v1', LSTS='rumo-ts-v1', LSCFG='rumo-sync-v1';
let TS={}; try{TS=JSON.parse(localStorage.getItem(LSTS)||'{}')||{}}catch(e){}
const SB={client:null,user:null,cfg:null,timers:{},estado:'off',ultima:null,canal:null};
try{SB.cfg=JSON.parse(localStorage.getItem(LSCFG)||'null')}catch(e){}

function cacheLocal(){ if(REAL) return; try{localStorage.setItem(LS,JSON.stringify({S,M}));localStorage.setItem(LSTS,JSON.stringify(TS))}catch(e){ if(!avisouCheio){avisouCheio=true;toast('A memória do navegador encheu. Apague fotos de metas ou lançamentos antigos.')} } }
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);for(const k of KEYS)S[k]=fill(DEF[k],o.S?.[k]);M=o.M||{}}}catch(e){}}
function save(k){
  if(REAL) return;
  TS[k]=Date.now(); cacheLocal();
  if(SB.user){ clearTimeout(SB.timers[k]); SB.timers[k]=setTimeout(()=>{delete SB.timers[k];push(k)},600); }

}
const bodyOf=k=>k.startsWith('m:')?(M[k.slice(2)]||{tx:[]}):S[k];
async function push(k){
  if(!SB.user) return;
  try{
    const {error}=await SB.client.from('rumo_docs').upsert({user_id:SB.user.id,key:k,data:JSON.parse(JSON.stringify(bodyOf(k))),updated_at:new Date(TS[k]||Date.now()).toISOString()});

  }catch(e){ SB.estado='erro'; }

function flushAll(){ for(const k of Object.keys(SB.timers)){ clearTimeout(SB.timers[k]); delete SB.timers[k]; push(k); } }
function aplicar(k,data,ts){
  if(SB.timers[k]) return;
  if(TS[k]&&ts<=TS[k]) return;
  const alvo=REAL||{S,M};
  if(k.startsWith('m:')) alvo.M[k.slice(2)]={tx:Array.isArray(data?.tx)?data.tx:[]};
  else if(DEF[k]) alvo.S[k]=fill(DEF[k],data);

async function pull(){
  if(!SB.user) return;
  SB.estado='sync'; drawBanner();
  const {data,error}=await SB.client.from('rumo_docs').select('key,data,updated_at');
  if(error){ SB.estado='erro'; drawBanner(); if(UI.view==='ajustes') render(); return; }

  for(const r of data||[]){ const ts=Date.parse(r.updated_at); remoto[r.key]=ts; aplicar(r.key,r.data,ts); }
  const locais=[...KEYS,...Object.keys(REAL?REAL.M:M).map(m=>'m:'+m)].filter(k=>TS[k]);

    pull();
  } else SB.estado='off';
  drawBanner(); if(UI.view==='ajustes') render();

async function initSync(){
  if(!SB.cfg){ drawBanner(); return; }

    SB.client=window.supabase.createClient(SB.cfg.url,SB.cfg.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'rumo-auth'}});

  }catch(e){ SB.estado='erro'; drawBanner(); }
}

const VERSAO='2026-10-21.2';
async function checaVersao(manual){
  try{ const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); const t=await r.text(); const m=t.match(/const VERSAO='([^']+)'/);

  }catch(e){ if(manual) toast('Sem internet pra procurar agora'); }
}

const GENERIC=new Set(['compra','compras','pix','env','enviado','enviada','rec','recebido','deb','debito','credito','cartao','pag','pagamento','pgto','transf','transferencia','ted','doc','no','na','em','de','do','da','com','elo','visa','master','mastercard','internacional','parcela','int','pg','qr','code']);
function chaveDesc(desc){ return norm(desc).split(' ').filter(x=>x&&!GENERIC.has(x)&&!/^\d+$/.test(x)).slice(0,2).join(' '); }

function recAtivo(r,m){ if(r.tipo!=='parcela'||!r.total) return true; const k=monthsBetween(r.inicioMes||m,m); return k>=0&&k<(+r.total-(+r.pagasAntes||0)); }
function parcelaNum(r,m){ return (+r.pagasAntes||0)+monthsBetween(r.inicioMes||m,m)+1; }
function fin(m){
  const tx=txMes(m); let ent=0,sai=0,guard=0; const porCat={};
  for(const t of tx){ const v=+t.valor||0; if(t.tipo==='entrada') ent+=v; else if(t.cat===GUARD) guard+=v; else {sai+=v; porCat[t.cat]=(porCat[t.cat]||0)+v;} }
  const pend=S.fin.recorrentes.filter(r=>recAtivo(r,m)&&!(r.pagos||{})[m]).reduce((a,r)=>a+(+r.valor||0),0);
  const renda=+cfg().renda||0, base=Math.max(renda,ent);
  const reservaG=Math.max(+cfg().guardar||0,guard);
  const livre=base-sai-pend-reservaG;
  const orcTot=cfg().cats.reduce((a,c)=>a+(+c.orc||0),0);
  const cur=TODAY().slice(0,7);
  const diasRest=m===cur?daysInMonth(m)-new Date().getDate()+1:(m>cur?daysInMonth(m):0);
  const porDia=diasRest?Math.max(0,livre)/diasRest:0;
  const ateDom=porDia*Math.min(diasRest,((7-new Date().getDay())%7)+1);
  const comprom=base?(sai+pend+reservaG)/base:0;
  return {tx,ent,sai,guard,porCat,pend,renda,base,livre,orcTot,diasRest,porDia,ateDom,comprom};
}
function addTx(t){ const m=t.data.slice(0,7); if(!M[m]) M[m]={tx:[]}; M[m].tx.push(t); save('m:'+m); return t; }
function delTx(id,m){ if(!M[m]) return; M[m].tx=M[m].tx.filter(t=>t.id!==id); save('m:'+m); }
function findTx(id){ for(const m in M){ const t=(M[m].tx||[]).find(x=>x.id===id); if(t) return [t,m]; } return [null,null]; }
function mediaGastos(){ const cur=TODAY().slice(0,7); const ms=Object.keys(M).filter(m=>m<cur&&fin(m).sai>0).sort().slice(-3); if(!ms.length){ const f=fin(cur); return Math.max(f.orcTot,f.sai+f.pend)||0; } return ms.reduce((a,m)=>a+fin(m).sai,0)/ms.length; }
function repetidos(){
  const ms=Object.keys(M).sort().slice(-4); const g={};
  for(const m of ms) for(const t of txMes(m)){ if(!ehGasto(t)||t.origem==='recorrente') continue; const k=chaveDesc(t.desc); if(!k) continue; (g[k]=g[k]||{k,meses:{},cnt:{},cat:t.cat}); g[k].meses[m]=(g[k].meses[m]||0)+(+t.valor||0); g[k].cnt[m]=(g[k].cnt[m]||0)+1; }

    .map(x=>({...x,anual:x.med*12})).sort((a,b)=>b.anual-a.anual).slice(0,8);

function avaliaCompra(valor,cat,parcelas){
  const f=fin(TODAY().slice(0,7)); const lim=(+cfg().limite||90)/100; parcelas=Math.max(1,+parcelas||1);
  const impacto=valor/parcelas;
  if(f.base<=0) return {v:null,titulo:'Falta um dado',msg:'Coloque quanto você espera receber neste mês (Orçamento › Editar plano) pra eu conseguir responder.'};
  const hoje=f.comprom, depois=(f.base*f.comprom+impacto)/f.base;
  const c=cfg().cats.find(x=>x.n===cat); const restCat=c&&+c.orc?(+c.orc-(f.porCat[cat]||0)):null;
  let v,titulo,msg;
  if(depois>1){ v='nao'; titulo='Melhor não agora'; msg=`Não cabe no mês: passaria ${brl0((depois-1)*f.base)} do que entra.`; }
  else if(depois>lim){ v='custo'; titulo='Cabe, mas'; msg=`Passa da sua regra dos ${Math.round(lim*100)}%: ${Math.round(depois*100)}% da renda ficaria com destino.`; }
  else if(restCat!==null&&impacto>restCat){ v='custo'; titulo='Cabe, mas'; msg=`${cat} passa do combinado em ${brl0(impacto-Math.max(0,restCat))}.`; }
  else { v='pode'; titulo='Pode ir'; msg=`Depois dela ainda ficam ${brl0(f.livre-impacto)} livres no mês.`; }
  let passo;
  if(v==='pode') passo=parcelas>1?`Em ${parcelas}x, cada parcela de ${brl0(impacto)} entra nas contas dos próximos ${parcelas} meses.`:'Se é compra planejada, pode ir sem culpa.';
  else if(v==='custo') passo=`Neste mês seus gastos iriam a ${Math.round(depois*100)}% da renda, sobrando menos pra guardar. Se der, espere o mês virar ou junte antes.`;
  else passo=`Guardando ${brl0(valor/3)} por mês, em 3 meses ela cabe sem aperto.`;
  return {v,titulo,msg,passo,hoje,depois,lim,impacto};
}
function simDividas(extra,metodo){
  let ds=S.fin.dividas.filter(d=>!d.saudavel&&+d.saldo>0).map(d=>({...d,s:+d.saldo,j:(+d.juros||0)/100,p:+d.parcela||0,fim:null}));
  if(!ds.length) return null;
  const orc=ds.reduce((a,d)=>a+d.p,0)+(+extra||0); let mes=0,juros=0;
  while(ds.some(d=>d.s>0.01)&&mes<600){
    mes++; let pool=orc;
    ds.forEach(d=>{ if(d.s>0.01){ const j=d.s*d.j; d.s+=j; juros+=j; } });
    ds.forEach(d=>{ if(d.s>0.01){ const pg=Math.min(d.p,d.s,pool); d.s-=pg; pool-=pg; } });
    const ord=ds.filter(d=>d.s>0.01).sort((a,b)=>metodo==='avalanche'?(b.j-a.j||a.s-b.s):(a.s-b.s));
    for(const d of ord){ if(pool<=0) break; const pg=Math.min(pool,d.s); d.s-=pg; pool-=pg; }
    ds.forEach(d=>{ if(d.s<=0.01&&!d.fim) d.fim=mes; });
  }
  return {meses:mes>=600?null:mes,juros,ordem:[...ds].sort((a,b)=>(a.fim||9999)-(b.fim||9999)),orc};
}

  for(const g of S.metas.items){ if(!g.prazo) continue; const tot=(g.etapas||[]).length,ok=(g.etapas||[]).filter(e=>e.ok).length; const f3=diffDays(t,g.prazo); if(f3>=0&&f3<=14&&(!tot||ok<tot)) out.push({n:'media',txt:`“${g.titulo}” vence em ${f3} ${plural(f3,'dia','dias')}`,sub:tot?`${ok} de ${tot} etapas feitas`:'Ainda sem etapas',acts:[['go','Ver','',{v:'metas'}]]}); }
  const ord={alta:0,media:1,info:2}; return out.sort((a,b)=>ord[a.n]-ord[b.n]);

function timeline(d,its){
  const PX=56; const START=Math.min(6,...its.map(i=>Math.floor(toMin(i.hora)/60))); const END=24, H=(END-START)*PX;
  const evs=its.map(i=>{const s=toMin(i.hora)-START*60;return {i,s,e:Math.min((END-START)*60,s+Math.max(20,defDur(i)))}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const clusters=[]; let cur=null;
  for(const ev of evs){ if(!cur||ev.s>=cur.end){cur={items:[],end:ev.e};clusters.push(cur)} cur.items.push(ev); cur.end=Math.max(cur.end,ev.e); }
  for(const c of clusters){ const cols=[]; for(const ev of c.items){ let k=cols.findIndex(e=>e<=ev.s); if(k<0){k=cols.length;cols.push(ev.e)}else cols[k]=ev.e; ev.col=k; } c.items.forEach(ev=>ev.n=cols.length); }
  const nowMin=new Date().getHours()*60+new Date().getMinutes()-START*60;
  const foco=evs[0]?evs[0].s:(d===TODAY()?nowMin:120);
  let h=`<div class="tlwrap" id="tlwrap" data-scroll="${Math.max(0,Math.round((foco/60-0.5)*PX))}"><div class="tl" style="height:${H}px">`;
  for(let x=START;x<END;x++) h+=`<div class="hr" style="top:${(x-START)*PX}px"><span>${pad(x)}:00</span></div>`;
  for(const ev of evs){ const i=ev.i, done=isDone(i,d);
    h+=`<button class="blk t-${i.tipo} ${done?'done':''}" data-a="editT" data-id="${i.id}" style="top:${ev.s*PX/60+1}px;height:${Math.max(22,(ev.e-ev.s)*PX/60-2)}px;left:calc(52px + (100% - 58px)*${ev.col}/${ev.n});width:calc((100% - 58px)/${ev.n} - 4px)"><b>${esc(i.hora)} ${esc(i.titulo)}</b>${(ev.e-ev.s)>=40?`<small>${esc([durTxt(defDur(i)),i.etiqueta].filter(Boolean).join(' · '))}</small>`:''}</button>`; }
  if(d===TODAY()&&nowMin>=0) h+=`<div class="now" style="top:${nowMin*PX/60}px"></div>`;
  if(!evs.length) h+=`<p class="muted small" style="position:absolute;top:${2*PX+8}px;left:60px;right:12px">Nada com horário neste dia.</p>`;
  return h+`</div></div>`;
}

function gcal({titulo,data,hora,dur,detalhes,rrule}){

function chartMes(m){

function previsao(n){
  const cur=TODAY().slice(0,7);
  const hist=Object.keys(M).filter(m=>m<cur&&txMes(m).length).sort().slice(-3);
  const media=f=>hist.length?hist.reduce((a,m)=>a+f(m),0)/hist.length:0;
  const varMes=m=>txMes(m).filter(t=>ehGasto(t)&&t.origem!=='recorrente').reduce((a,t)=>a+(+t.valor||0),0);
  const fixasNomes=new Set(S.fin.recorrentes.map(r=>norm(r.nome)));
  const varMed=hist.length?media(m=>txMes(m).filter(t=>ehGasto(t)&&t.origem!=='recorrente'&&!fixasNomes.has(norm(t.desc))).reduce((a,t)=>a+(+t.valor||0),0)):0;
  const fixTot=S.fin.recorrentes.reduce((a,r)=>a+(+r.valor||0),0);
  const variavel=hist.length?varMed:Math.max(0,cfg().cats.reduce((a,c)=>a+(+c.orc||0),0)-fixTot);
  const entMed=media(m=>fin(m).ent);
  const renda=+cfg().renda||entMed;
  const sim=simDividas(+cfg().extraDivida||0,cfg().metodo||'avalanche');
  const metasAtivas=S.fin.metas.filter(x=>metaInfo(x).status!=='Chegou');
  const meses=[]; let acum=0;
  for(let k=1;k<=n;k++){
    const m=addMonth(cur,k);
    const recs=S.fin.recorrentes.filter(r=>recAtivo(r,m));
    const contas=recs.filter(r=>r.tipo!=='parcela').reduce((a,r)=>a+(+r.valor||0),0);
    const parcelas=recs.filter(r=>r.tipo==='parcela').reduce((a,r)=>a+(+r.valor||0),0);
    const dividas=sim&&sim.meses&&k<=sim.meses?sim.orc:(sim&&!sim.meses?sim.orc:0);
    const metas=metasAtivas.filter(x=>!x.prazo||x.prazo.slice(0,7)>=m).reduce((a,x)=>a+metaInfo(x).porMes,0);
    const guardar=Math.max(+cfg().guardar||0,metas);
    const sai=contas+parcelas+variavel+dividas+guardar;
    const sobra=renda-sai; acum+=sobra;
    meses.push({m,entrada:renda,contas,parcelas,variavel,dividas,guardar,sai,sobra,acum});
  }
  const eventos=[];
  for(const r of S.fin.recorrentes){ if(r.tipo!=='parcela'||!r.total) continue; const fimK=monthsBetween(cur,addMonth(r.inicioMes||cur,(+r.total-(+r.pagasAntes||0))-1)); if(fimK>=1&&fimK<=n) eventos.push({k:fimK,txt:`Última parcela de ${r.nome} em ${fmtMc(addMonth(cur,fimK))}. Depois sobram mais ${brl0(r.valor)} por mês.`}); }
  if(sim&&sim.meses) for(const d of sim.ordem) if(d.fim&&d.fim<=n) eventos.push({k:d.fim,txt:`${d.nome} quitada em ${mesDaqui(d.fim)}.`});
  for(const x of metasAtivas){ if(!x.prazo) continue; const k=monthsBetween(cur,x.prazo.slice(0,7)); if(k>=1&&k<=n) eventos.push({k,txt:`Prazo da meta ${x.nome}: ${fmtMc(x.prazo.slice(0,7))}.`}); }
  eventos.sort((a,b)=>a.k-b.k);
  return {meses,eventos,hist:hist.length,renda,rendaFonte:+cfg().renda?'plano':'media',variavel};
}

function parseNum(s){ s=String(s??'').replace(/R\$|\s/g,'').replace(/[^\d,.\-()]/g,''); if(!s) return NaN; const neg=/^\(.*\)$/.test(s)||s.includes('-'); s=s.replace(/[()\-]/g,'');

  const v=parseFloat(s); return neg?-v:v; }
function parseDate(s,anoPadrao){ s=String(s||'').trim(); let m;

  if(m=s.match(/^(\d{4})(\d{2})(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/)) return `${anoPadrao||new Date().getFullYear()}-${pad(+m[2])}-${pad(+m[1])}`;
  if(/^\d{5}$/.test(s)){ const d=new Date(Math.round((+s-25569)*864e5)); return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  return null; }
function splitCSV(text){ const first=text.split(/\r?\n/)[0]||''; const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];

    else if(ch==='"') q=true; else if(ch===delim){row.push(cell);cell=''} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=ch; }

function rowsToTx(rows){
  let hi=-1; const idx={};
  for(let i=0;i<Math.min(rows.length,15);i++){ const h=rows[i].map(c=>norm(c)); const di=h.findIndex(x=>/^(data|date|dt)( |$)/.test(x)); const vi=h.findIndex(x=>/(valor|amount|quantia|montante)/.test(x)); if(di>-1&&vi>-1){ hi=i; idx.d=di; idx.v=vi; idx.s=h.findIndex(x=>/(descri|historico|lancamento|title|titulo|estabelecimento|memo)/.test(x)); if(idx.s<0) idx.s=h.findIndex(x=>/(identificador|detalhe)/.test(x)); idx.card=h.includes('title'); break; } }
  const body=hi>-1?rows.slice(hi+1):rows;
  if(hi<0&&body.length){ const r=body[0]; idx.d=r.findIndex(c=>parseDate(c)); const nums=r.map((c,i)=>/\d/.test(c)&&!isNaN(parseNum(c))&&i!==idx.d?i:-1).filter(i=>i>-1); idx.v=nums[nums.length-1]; let best=-1,len=0; r.forEach((c,i)=>{ if(i!==idx.d&&i!==idx.v&&String(c).length>len){len=String(c).length;best=i} }); idx.s=best; }
  if(idx.d==null||idx.d<0||idx.v==null||idx.v<0) return [];
  const raw=body.map(r=>({data:parseDate(r[idx.d]),desc:String(r[idx.s]??'').trim()||'Lançamento',v:parseNum(r[idx.v])})).filter(x=>x.data&&!isNaN(x.v)&&x.v!==0);
  const allPos=raw.length&&raw.every(x=>x.v>0); const card=idx.card||(allPos&&raw.length>2);
  return raw.filter(x=>!/pagamento recebido|saldo anterior|saldo do dia|^saldo/i.test(x.desc)).map(x=>({data:x.data,desc:x.desc,valor:Math.abs(x.v),tipo:card?(x.v>0?'saida':'entrada'):(x.v<0?'saida':'entrada')}));
}
function parseOFX(text){ const out=[]; for(const b of text.split(/<STMTTRN>/i).slice(1)){ const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''}; const v=parseFloat(g('TRNAMT').replace(',','.')); const d=parseDate(g('DTPOSTED')); const desc=g('MEMO')||g('NAME')||'Lançamento'; if(d&&!isNaN(v)&&v!==0) out.push({data:d,desc,valor:Math.abs(v),tipo:v<0?'saida':'entrada'}); } return out; }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
async function pdfText(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; let out='';
  for(let p=1;p<=Math.min(doc.numPages,30);p++){ const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const lines={};
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (lines[y]=lines[y]||[]).push([it.transform[4],it.str]); });
    out+=Object.keys(lines).sort((a,b)=>b-a).map(y=>lines[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ')).join('\n')+'\n'; }
  return out; }
function regexExtrato(text){ const out=[]; const ano=new Date().getFullYear();
  for(const ln of text.split('\n')){ const m=ln.match(/^\s*(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?)\s+(.+?)\s+(-?\s?R?\$?\s?-?[\d.]+,\d{2})\s*(D|C|-)?\s*$/i); if(!m) continue; const v=parseNum(m[3]); if(isNaN(v)||!v) continue; out.push({data:parseDate(m[1],ano),desc:m[2].trim(),valor:Math.abs(v),tipo:(v<0||/D|-/i.test(m[4]||''))?'saida':'entrada'}); }
  return out; }
async function importarArquivo(file){

  const msg=t=>{const e=$('#impMsg');if(e)e.textContent=t};
  try{
    if(/\.(ofx|qfx)$/.test(nome)) rows=parseOFX(await file.text());
    else if(/\.(csv|txt)$/.test(nome)){ const t=await file.text(); rows=t.includes('<STMTTRN>')?parseOFX(t):rowsToTx(splitCSV(t)); }
    else if(/\.(xlsx|xls)$/.test(nome)){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); for(const sn of wb.SheetNames){ rows=rowsToTx(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''}).map(r=>r.map(String))); if(rows.length) break; } }
    else if(/\.pdf$/.test(nome)){ msg('Lendo o PDF…'); rows=regexExtrato(await pdfText(file)); if(!rows.length){ openSheet(`${sheetHead('Não consegui ler esse PDF')}<p>Alguns bancos montam o PDF de um jeito que não dá pra ler automaticamente. Tente exportar em CSV, OFX ou Excel no app do banco.</p>`); return; } }
    else if(file.type.startsWith('image/')){ openSheet(`${sheetHead('Print ainda não dá')}<p>Sem a assistente eu não consigo ler imagem. Exporte o extrato em CSV, OFX, Excel ou PDF no app do banco.</p>`); return; }
  }catch(e){ openSheet(`${sheetHead('Não consegui ler esse arquivo')}<p>Tente exportar de novo no app do banco, de preferência em CSV ou OFX.</p>`); return; }
  if(!rows.length){ openSheet(`${sheetHead('Não achei lançamentos')}<p>O arquivo abriu, mas não reconheci as colunas de data e valor. Tente o formato CSV ou OFX no app do banco.</p>`); return; }
  if(REAL){ openSheet(`${sheetHead('Modo demonstração')}<p>Li ${rows.length} lançamentos, mas na demonstração nada é salvo. Saia da demonstração pra importar de verdade.</p>`); return; }
  const novos=[],dups=[]; const ms=new Set();
  for(const r of rows){ const dup=Object.values(M).some(x=>(x.tx||[]).some(t=>Math.abs((+t.valor||0)-r.valor)<0.01&&t.tipo===r.tipo&&Math.abs(diffDays(t.data,r.data))<=3)); if(dup){dups.push(r);continue}
    const cat=r.tipo==='entrada'?'Outras entradas':categorizar(r.desc); const t={id:uid(),data:r.data,desc:r.desc,valor:r2(r.valor),tipo:r.tipo,cat,origem:'import',ok:cat!=='Outros'}; const m=r.data.slice(0,7); if(!M[m])M[m]={tx:[]}; M[m].tx.push(t); ms.add(m); novos.push(t); }
  ms.forEach(m=>save('m:'+m)); UI.lastImport=novos.map(t=>t.id);
  const meses=[...ms].sort(); if(meses.length) UI.mes=meses[meses.length-1];
  const conferir=novos.filter(t=>t.tipo!=='entrada'&&t.cat==='Outros');
  UI.sub.dinheiro='resumo'; pendingRender=true;
  openSheet(`${sheetHead('Pronto, o mês se montou')}<div class="card hero"><div class="big num" style="font-size:36px">${novos.length}</div><span class="small">lançamentos entraram${meses.length?' em '+meses.map(fmtM).join(', '):''}.</span></div>
   ${dups.length?`<p class="small muted">${dups.length} ${plural(dups.length,'parecia já estar','pareciam já estar')} no app e ${plural(dups.length,'ficou','ficaram')} de fora.</p>`:''}
   ${conferir.length?`<button class="btn pri block" data-a="issoEoQue">Conferir ${conferir.length} que não reconheci</button>`:''}<div class="row between"><button class="btn ghost danger" data-a="desfazImport">Desfazer importação</button><button class="btn" data-a="fecharSheet">Ver o resumo</button></div>`);
}

function geraLembretes(){
  const N=NC(), out=[], agora=Date.now(), t=TODAY();
  const em=(d,hm)=>{ const [y,m,dd]=d.split('-').map(Number), [hh,mi]=(hm||'09:00').split(':').map(Number); return new Date(y,m-1,dd,hh,mi,0); };
  const add=(chave,q,titulo,corpo)=>{ if(q.getTime()>agora+30000) out.push({chave,quando:q.toISOString(),titulo,corpo:corpo||''}); };
  for(let k=0;k<14;k++){
    const d=addDays(t,k), its=itensDoDia(d);
    for(const i of its){ if(!i.hora||isDone(i,d)||isSkip(i,d)) continue;
      const q=new Date(em(d,i.hora).getTime()-(+N.antes||0)*60000);
      const quando=+N.antes?`em ${N.antes} min (${i.hora})`:`agora, ${i.hora}`;
      add('i:'+i.id+':'+d,q,i.titulo,(i.tipo==='compromisso'?'Compromisso ':i.tipo==='habito'?'Hábito ':'')+quando+(i.local?' · '+i.local:'')); }
    if(N.resumo){ const pend=its.filter(i=>!isDone(i,d)&&!isSkip(i,d)); if(pend.length) add('r:'+d,em(d,N.resumo),'Seu dia: '+pend.length+' '+plural(pend.length,'coisa','coisas'),pend.slice(0,3).map(i=>(i.hora?i.hora+' ':'')+i.titulo).join(' · ')+(pend.length>3?' …':'')); }
  }
  if(N.inj){ const j=injStatus(); if(j){ const nome=S.saude.injecao.nome||'injeção';
    add('inj:'+j.prox,em(j.prox,'09:00'),'Hoje é dia da '+nome,'Depois de tomar, registre no Rumo.');
    add('inj-1:'+j.prox,em(addDays(j.prox,-1),'20:00'),'Amanhã é dia da '+nome,'Já deixa separado.'); } }
  if(N.contas){ for(const mm of [t.slice(0,7),addMonth(t.slice(0,7),1)]) for(const r of S.fin.recorrentes){ if(!r.dia||!recAtivo(r,mm)||(r.pagos||{})[mm]) continue;
    const v=mm+'-'+pad(Math.min(+r.dia,daysInMonth(mm))); if(v<t||diffDays(t,v)>14) continue;
    add('c:'+r.id+':'+mm,em(v,'09:00'),'Vence hoje: '+r.nome,brl(r.valor)+' · marque como paga quando pagar.');
    if(diffDays(t,v)>=2) add('c2:'+r.id+':'+mm,em(addDays(v,-2),'09:00'),'Daqui 2 dias vence: '+r.nome,brl(r.valor)); } }
  return out.sort((a,b)=>a.quando<b.quando?-1:1).slice(0,300);
}
let lembT=null;
function agendaLembretes(){ clearTimeout(lembT); lembT=setTimeout(syncLembretes,2500); }
async function syncLembretes(){
  if(REAL||!SB.user||!NC().on) return;
  try{
    const novos=geraLembretes().map(x=>({...x,user_id:SB.user.id}));
    const {data:ex,error}=await SB.client.from('rumo_lembretes').select('id,chave').eq('enviado',false).gt('quando',new Date().toISOString()); if(error) throw error;
    const keep=new Set(novos.map(x=>x.chave)), apagar=(ex||[]).filter(x=>!keep.has(x.chave)).map(x=>x.id);
    for(let i=0;i<apagar.length;i+=100) await SB.client.from('rumo_lembretes').delete().in('id',apagar.slice(i,i+100));
    if(novos.length){ const {error:e2}=await SB.client.from('rumo_lembretes').upsert(novos,{onConflict:'user_id,chave'}); if(e2) throw e2; }
    PUSH.erro='';
  }catch(e){ PUSH.erro='lembretes'; }
}
async function ativarPush(){
  if(!SB.user){ toast('Entre na sincronização primeiro'); return; }
  try{
    const perm=await Notification.requestPermission(); if(perm!=='granted'){ toast('Sem permissão. Libere em Ajustes do iPhone › Notificações › Rumo'); return; }
    const reg=await swReg(); await navigator.serviceWorker.ready;
    let r; try{ r=await fetch(fnURL('acao=chave')); }catch(e){ r=null; }
    if(!r||!r.ok){ PUSH.erro='servidor'; render(); toast('Falta configurar o carteiro no Supabase'); return; }
    const {publica}=await r.json();
    let sub=await reg.pushManager.getSubscription(); if(sub) { try{ await sub.unsubscribe(); }catch(e){} }
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(publica)});
    const {error}=await SB.client.from('rumo_push_subs').upsert({endpoint:sub.endpoint,user_id:SB.user.id,sub:sub.toJSON()}); if(error){ PUSH.erro='tabela'; render(); toast('Falta rodar o SQL das notificações'); return; }
    NC().on=true; save('perfil'); PUSH.sub=sub; PUSH.estado='on'; PUSH.erro='';
    await syncLembretes(); fetch(fnURL('acao=teste&endpoint='+encodeURIComponent(sub.endpoint))).catch(()=>{});
    render(); toast('Notificações ligadas neste aparelho');
  }catch(e){ PUSH.erro='outro'; render(); toast('Não deu pra ligar: '+(e.message||e)); }
}
async function desativarPush(){
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await SB.client.from('rumo_push_subs').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); } }catch(e){}
  PUSH.sub=null; PUSH.estado='off'; render(); toast('Notificações desligadas neste aparelho');
}

/* ================= adicionar rápido na agenda ================= */
function parseItem(txt){
  const n=norm(txt), t=TODAY(); let data=UI.view==='agenda'?UI.ag.dia:UI.dia, hora='';
  const hm=txt.match(/\b(?:às|as|a partir das)?\s*(\d{1,2})(?:[:h](\d{2})?)\s*(?:h|hs|horas)?\b/i)||txt.match(/\b(\d{1,2})\s*(?:h|hs|horas)\b/i);
  if(hm&&+hm[1]<24) hora=pad(+hm[1])+':'+pad(+(hm[2]||0));
  if(/\bhoje\b/.test(n)) data=t; else if(/\bdepois de amanha\b/.test(n)) data=addDays(t,2); else if(/\bamanha\b/.test(n)) data=addDays(t,1);
  const dias=[['domingo',0],['segunda',1],['terca',2],['quarta',3],['quinta',4],['sexta',5],['sabado',6]];
  for(const [w,k] of dias){ if(new RegExp('\\b'+w).test(n)){ const wd=parseD(t).getDay(); let dd=(k-wd+7)%7; if(dd===0) dd=7; data=addDays(t,dd); break; } }
  const dm=txt.match(/\bdia\s+(\d{1,2})(?:\/(\d{1,2}))?/i); if(dm){ let m=dm[2]?pad(+dm[2]):t.slice(5,7); let d=t.slice(0,4)+'-'+m+'-'+pad(+dm[1]); if(d<t&&!dm[2]) d=addMonth(t.slice(0,7),1)+'-'+pad(+dm[1]); data=d; }
  const comp=/(reuniao|consulta|dentista|medic|call|entrevista|aniversario|festa|aula|exame|encontro|almoco com|jantar com|gravacao com)/.test(n);
  let titulo=(' '+txt+' ').replace(/\s(?:às|as|a partir das)\s+\d{1,2}(?:[:h]\d{0,2})?\s*(?:h|hs|horas)?(?=\s|$)/gi,' ').replace(/\s\d{1,2}(?::\d{2}|h\d{0,2}|hs)(?=\s|$)/gi,' ').replace(/\sdia\s+\d{1,2}(?:\/\d{1,2})?(?=\s|$)/gi,' ').replace(/\s(?:depois de amanhã|depois de amanha|amanhã|amanha|hoje)(?=\s|$)/gi,' ').replace(/\s(?:na |no )?(?:próxima |proxima )?(?:segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)(?:-feira)?(?=\s|$)/gi,' ').replace(/\s+/g,' ').trim();
  return {tipo:comp?'compromisso':'tarefa',titulo:cap(titulo)||cap(txt),data,hora,rep:'nao',dur:comp?60:30};
}

/* ================= lançamento falado ================= */
const NW={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000};
function palavrasNum(words){ let total=0,cur=0,used=[],started=false;
  for(let i=0;i<words.length;i++){ const w=words[i];
    if(w in NW){ started=true; used.push(i); if(w==='mil'){ total+=(cur||1)*1000; cur=0; } else cur+=NW[w]; }
    else if(w==='e'&&started&&(words[i+1] in NW)) used.push(i);
    else if(started) break; }
  return started?{v:total+cur,used}:null; }
function parseLanc(txt){
  let s=' '+txt.trim()+' ', tipo='saida', data=TODAY(); const n=norm(txt);
  if(/^(recebi|ganhei|entrou|entrada|caiu|vendi)\b/.test(n)) tipo='entrada';
  if(/\bontem\b/.test(n)) data=addDays(TODAY(),-1);
  if(/\banteontem\b/.test(n)) data=addDays(TODAY(),-2);
  let valor=null;
  const m=s.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/i);
  if(m){ valor=parseNum(m[1]); s=s.replace(m[0],' '); }
  else { const ws=n.split(' '); const r=palavrasNum(ws);
    if(r){ valor=r.v; const used=new Set(r.used); let j=Math.max(...r.used)+1;
      if(ws[j]==='reais'||ws[j]==='real'){used.add(j);j++}
      if(ws[j]==='e'){ const c=palavrasNum(ws.slice(j+1)); if(c&&c.used[0]===0){ const end=j+1+Math.max(...c.used); if(ws[end+1]==='centavos'){ valor+=c.v/100; used.add(j); c.used.forEach(k=>used.add(j+1+k)); used.add(end+1); } } }
      s=' '+ws.filter((_,i)=>!used.has(i)).join(' ')+' '; } }
  const desc=s.replace(/\b(reais|real|r\$|centavos|gastei|paguei|comprei|recebi|ganhei|entrou|entrada|caiu|vendi|ontem|anteontem|hoje|no|na|nos|nas|com|de|do|da|em|e|um|uma|pra|para)\b/gi,' ').replace(/[,.;:]/g,' ').replace(/\s+/g,' ').trim();
  return {valor,desc:cap(desc)||(tipo==='entrada'?'Entrada':'Gasto'),tipo,data};
}

function tick(){ if(!UI.timer) return; const el=$('#timerTxt'); const rest=Math.max(0,Math.round((UI.timer.fim-Date.now())/1000)); if(el) el.textContent=pad(Math.floor(rest/60))+':'+pad(rest%60); if(rest<=0){ fimTimer(false); return; } setTimeout(tick,1000); }
function fimTimer(manual){ const tm=UI.timer; if(!tm) return; const min=Math.max(1,Math.round((Math.min(Date.now(),tm.fim)-tm.ini)/60000)); const x=S.estudos.materias.find(y=>y.id===tm.id); if(x){x.sessoes=x.sessoes||[];x.sessoes.push({data:TODAY(),min});save('estudos')} UI.timer=null; render(); toast(manual?`${min} min registrados`:`Foco concluído: ${min} min registrados`); }

function reduzFoto(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const max=900, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=()=>{URL.revokeObjectURL(u);rej()}; img.src=u; }); }

   toast(`${p.tipo==='entrada'?'+':'−'} ${brl(t.valor)} · ${t.desc} · ${t.cat}`,()=>{delTx(t.id,t.data.slice(0,7));render()})},
 tx:(o,f)=>{const id=f.dataset.id;const b={desc:String(o.desc).trim(),valor:r2(Math.abs(+o.valor||0)),tipo:o.tipo,cat:o.cat,data:o.data,ok:true};
   if(id){const [t,m]=findTx(id);if(m!==b.data.slice(0,7)){delTx(id,m);addTx({...t,...b})}else{Object.assign(t,b);save('m:'+m)}} else addTx({id:uid(),...b,origem:'manual'});closeSheet();render()},
 rec:(o,f)=>{const id=f.dataset.id;const tipo=o.tipo||'conta';const b={nome:String(o.nome).trim(),valor:r2(+o.valor||0),dia:+o.dia||null,cat:o.cat,tipo,total:tipo==='parcela'?(+o.total||0):0,pagasAntes:tipo==='parcela'?(+o.pagasAntes||0):0};
   if(id){const r=S.fin.recorrentes.find(x=>x.id===id);Object.assign(r,b);if(!r.inicioMes)r.inicioMes=TODAY().slice(0,7)}else S.fin.recorrentes.push({id:uid(),...b,inicioMes:TODAY().slice(0,7),pagos:{}});save('fin');closeSheet();render()},
 comprar:o=>{const c={nome:String(o.nome).trim(),valor:r2(+o.valor||0),cat:o.cat,parcelas:+o.parcelas||1};c.res=avaliaCompra(c.valor,c.cat,c.parcelas);UI.compra=c;openSheet(compraHtml())},
 metaF:(o,f)=>{const id=f.dataset.id;
   if(id==='reserva'){const r=S.fin.reserva;r.guardado=+o.guardado||0;r.meses=+o.meses||6;r.prazo=o.prazo||'';r.foto=o.foto||'';if(!r.criado)r.criado=TODAY();}
   else{const b={nome:String(o.nome).trim(),valor:+o.valor||0,guardado:+o.guardado||0,prazo:o.prazo||'',foto:o.foto||''};if(id)Object.assign(S.fin.metas.find(x=>x.id===id),b);else S.fin.metas.push({id:uid(),...b,criado:TODAY()});}
   save('fin');closeSheet();render()},
 guardei:(o,f)=>{const v=+o.v||0;if(!v)return;const id=f.dataset.id;let nome;if(id==='reserva'){S.fin.reserva.guardado=r2((+S.fin.reserva.guardado||0)+v);nome='Reserva'}else{const x=S.fin.metas.find(y=>y.id===id);x.guardado=r2((+x.guardado||0)+v);nome=x.nome}
   addTx({id:uid(),data:TODAY(),desc:'Guardado: '+nome,valor:r2(v),tipo:'saida',cat:GUARD,origem:'meta',ok:true});save('fin');render();toast(`${brl(v)} guardados em ${nome}`)},
 div:(o,f)=>{const id=f.dataset.id;const b={nome:String(o.nome).trim(),saldo:+o.saldo||0,juros:+o.juros||0,parcela:+o.parcela||0,saudavel:!!o.saudavel};if(id)Object.assign(S.fin.dividas.find(x=>x.id===id),b);else S.fin.dividas.push({id:uid(),...b});save('fin');closeSheet();render()},
 calc:()=>{},
 meta:(o,f)=>{const id=f.dataset.id;const b={titulo:String(o.titulo).trim(),motivo:o.motivo||'',prazo:o.prazo||''};if(id)Object.assign(S.metas.items.find(g=>g.id===id),b);else S.metas.items.push({id:uid(),...b,etapas:[]});save('metas');closeSheet();render()},
 etapa:(o,f)=>{const t=String(o.t||'').trim();if(!t)return;S.metas.items.find(g=>g.id===f.dataset.g).etapas.push({id:uid(),t,ok:false});save('metas');render();setTimeout(()=>{const i=$('#et-'+f.dataset.g);if(i)i.focus()},30)},
 inj:o=>{const j=S.saude.injecao;j.intervalo=+o.intervalo||30;j.nome=o.nome||'';if(o.ultima)registraInj(o.ultima);save('saude');render();toast('Salvo')},
 menst:o=>{S.saude.ciclo.registros.push({inicio:o.inicio,...(o.fim?{fim:o.fim}:{})});save('saude');closeSheet();render()},
 sono:o=>{const d=o.data||TODAY();S.saude.sono=S.saude.sono.filter(s=>s.data!==d);S.saude.sono.push({data:d,deitou:o.deitou,acordou:o.acordou,q:+o.q||3});S.saude.sono.sort((a,b)=>a.data<b.data?-1:1);if(S.saude.sono.length>400)S.saude.sono=S.saude.sono.slice(-400);save('saude');render();toast('Noite registrada')},
 mat:(o,f)=>{const id=f.dataset.id;const b={nome:String(o.nome).trim(),meta:+o.meta||0};if(id)Object.assign(S.estudos.materias.find(x=>x.id===id),b);else S.estudos.materias.push({id:uid(),...b,sessoes:[]});save('estudos');closeSheet();render()},
 sessao:(o,f)=>{const min=+o.min||0;if(!min)return;const x=S.estudos.materias.find(y=>y.id===f.dataset.id);x.sessoes.push({data:TODAY(),min});save('estudos');render();toast(`${min} min registrados`)},
 item2:o=>{String(o.item||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>S.casa.compras.push({id:uid(),item:cap(x),secao:o.secao||'Mercado',ok:false}));save('casa');render();setTimeout(()=>{const i=$('#itemN');if(i)i.focus()},30)},
 rot:(o,f)=>{const id=f.dataset.id;const b={nome:String(o.nome).trim(),cada:+o.cada||7,ultima:o.ultima||'',comodo:o.comodo||''};if(id)Object.assign(S.casa.rotina.find(r=>r.id===id),b);else S.casa.rotina.push({id:uid(),...b});save('casa');closeSheet();render()},
 sbcfg:o=>{ const url=String(o.url||'').trim().replace(/\/+$/,''), key=String(o.key||'').trim(); if(!/^https:\/\/.+/.test(url)||key.length<20){toast('Confira a URL e a chave.');return} SB.cfg={url,key}; try{localStorage.setItem(LSCFG,JSON.stringify(SB.cfg))}catch(e){} initSync(); render(); },
 login:async o=>{ const {error}=await SB.client.auth.signInWithPassword({email:String(o.email).trim(),password:String(o.senha)}); if(error) toast(erroSB(error)); else toast('Entrou. Sincronizando…'); },
 perfil:o=>{S.perfil.nome=String(o.nome||'').trim();save('perfil');render();toast('Salvo')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const fn=ACT[b.dataset.a];if(fn){e.preventDefault();fn(b.dataset,b,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const fd=new FormData(f);const o={};for(const [k,v] of fd){if(k in o)o[k]=[].concat(o[k],v);else o[k]=v}const fn=FORMS[f.dataset.f];if(fn)fn(o,f)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatTxt'){e.preventDefault();e.target.form.requestSubmit()}
  if(e.key==='Enter'&&e.target.id==='psNovo'){e.preventDefault();const v=e.target.value.trim();if(!v)return;const k=document.querySelectorAll('#passosBox input[name=pok]').length;const row=document.createElement('div');row.className='row';row.innerHTML=`<input type="checkbox" name="pok" value="${k}" aria-label="Passo feito"><input type="text" name="passo" id="ps-${k}" value="${esc(v)}">`;e.target.parentElement.before(row);e.target.value='';}
  if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); if(e.key==='Escape') $('#drawer').hidden=true; });
let sonoArr=null;
function sonoMin(e){ const dial=$('#sonoDial'); const r=dial.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2; let a=Math.atan2(y,x)+Math.PI/2; if(a<0) a+=2*Math.PI; return Math.round(a/(2*Math.PI)*1440/5)*5%1440; }
document.addEventListener('pointerdown',e=>{ const dial=e.target.closest('#sonoDial'); if(!dial||!UI.sono) return; const g=e.target.closest('[data-h]'); const st=UI.sono;
  if(g) sonoArr=g.dataset.h; else { const m=sonoMin(e), db=Math.min(Math.abs(m-st.bed),1440-Math.abs(m-st.bed)), dw=Math.min(Math.abs(m-st.wake),1440-Math.abs(m-st.wake)); sonoArr=db<dw?'bed':'wake'; st[sonoArr]=m; sonoAtualizaDial(); }
  try{dial.setPointerCapture(e.pointerId)}catch(x){} e.preventDefault(); });
document.addEventListener('pointermove',e=>{ if(!sonoArr||!UI.sono||!$('#sonoDial')) return; UI.sono[sonoArr]=sonoMin(e); sonoAtualizaDial(); });
document.addEventListener('pointerup',()=>{sonoArr=null}); document.addEventListener('pointercancel',()=>{sonoArr=null});
let buscaT=null;
document.addEventListener('input',e=>{const el=e.target;const c=el.dataset&&el.dataset.c;
  if(c==='agBusca'||c==='txBusca'){clearTimeout(buscaT);buscaT=setTimeout(()=>{if(c==='agBusca')UI.ag.q=el.value;else UI.txq=el.value;const pos=el.selectionStart;render();const n=document.getElementById(el.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},250)}
  if(c==='calcIn'){const f=el.form;const cc=CALCS.find(x=>x.id===f.dataset.id);const v={};new FormData(f).forEach((val,k)=>v[k]=+val||0);let r;try{r=cc.calc(v)}catch(x){r='Confira os números.'}$('#calcRes').textContent=r}});
document.addEventListener('change',async e=>{const el=e.target;const c=el.dataset&&el.dataset.c;if(!c)return;
  if(c==='tipoItem'){const t=el.value;$('#fLocal').classList.toggle('hide',t!=='compromisso');const rep=$('#iRep');const o=rep.querySelector('option[value=nao]');if(t==='habito'){if(rep.value==='nao')rep.value='diario';if(o)o.remove()}else if(!o){rep.insertAdjacentHTML('afterbegin','<option value="nao">Não repetir</option>')}$('#fDias').classList.toggle('hide',rep.value!=='dias');$('#lData').textContent=rep.value==='nao'?'Data':'Começa em'}
  if(c==='repItem'){$('#fDias').classList.toggle('hide',el.value!=='dias');$('#lData').textContent=el.value==='nao'?'Data':'Começa em'}
  if(c==='tipoTx'){const sel=$('#txCat');const cats=el.value==='entrada'?ENTCATS:[...catNames(),GUARD];sel.innerHTML=cats.map(x=>`<option>${esc(x)}</option>`).join('')}
  if(c==='menuPos'){ const m=menuAtual(), i=+el.dataset.i, v=el.value, j=m.indexOf(v); if(j>-1&&j!==i) m[j]=m[i]; m[i]=v; S.perfil.menu=m; save('perfil'); render(); }
  if(c==='notifAntes'){ NC().antes=+el.value; save('perfil'); }
  if(c==='notifResumo'){ NC().resumo=el.value; save('perfil'); }
  if(c==='notifInj'){ NC().inj=el.value==='1'; save('perfil'); }
  if(c==='notifContas'){ NC().contas=el.value==='1'; save('perfil'); }
  if(c==='sonoData'){ if(el.value){ ACT.sonoDia({d:el.value}); } }
  if(c==='tipoRec'){const p=el.value==='parcela';$('#fParc1').classList.toggle('hide',!p);$('#fParc2').classList.toggle('hide',!p)}
  if(c==='metodo'){cfg().metodo=el.value;save('fin');openSheet(planoDivHtml());pendingRender=true}
  if(c==='extra'){cfg().extraDivida=+el.value||0;save('fin');openSheet(planoDivHtml());pendingRender=true}
  if(c==='importar'){const f=el.files&&el.files[0];el.value='';if(f)importarArquivo(f)}
  if(c==='metaFoto'){const f=el.files&&el.files[0];el.value='';if(!f)return;const msg=$('#fotoMsg');
    if(REAL){msg.textContent='Na demonstração a foto não é salva.';return}
    msg.textContent='Preparando a foto…';
    try{ const url=await reduzFoto(f); const id=uid(); S.fotos[id]=url; save('fotos'); $('#mfFoto').value=id; $('#fotoPrev').style.backgroundImage=`url('${url}')`; msg.textContent='Foto pronta. Toque em Salvar.'; }
    catch(x){ msg.textContent='Não consegui abrir essa foto. Tente outra.'; }}
  if(c==='restaurar'){const f=el.files&&el.files[0];el.value='';if(!f)return;if(REAL){toast('Saia da demonstração primeiro.');return}f.text().then(t=>{const o=JSON.parse(t);if(!o.S)throw 0;for(const k of KEYS){S[k]=fill(DEF[k],o.S[k]);save(k)}M=o.M||{};for(const m in M)save('m:'+m);migrar();render();toast('Cópia restaurada')}).catch(()=>toast('Esse arquivo não é uma cópia do Rumo.'))}
});
